<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Elias Uribe — Fullstack Developer">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#020408"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Runa central de fondo -->
  <text x="600" y="470" text-anchor="middle" font-family="Cinzel, serif" font-size="520" fill="#7dd3fc" opacity="0.04">ᛟ</text>

  <!-- Eyebrow con runas -->
  <text x="600" y="145" text-anchor="middle" font-family="Cinzel, serif" font-size="24" letter-spacing="12" fill="#7dd3fc" opacity="0.7">ᚠ  ᚢ  ᚦ  ᚨ  ᚱ</text>
  <text x="600" y="185" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="22" letter-spacing="6" font-weight="600" fill="#7dd3fc" opacity="0.85">FULLSTACK DEVELOPER · ARGENTINA</text>

  <!-- Nombre principal -->
  <text x="600" y="320" text-anchor="middle" font-family="Cinzel, serif" font-size="110" font-weight="900" fill="url(#nameGrad)">Elias Uribe</text>

  <!-- Divider -->
  <rect x="350" y="360" width="500" height="1" fill="url(#divider)"/>
  <text x="600" y="368" text-anchor="middle" font-size="14" fill="#7dd3fc">◆</text>

  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1">Angular 21 · Spring Boot · TypeScript · Java</text>

  <!-- Footer runas -->
  <text x="600" y="530" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="20" letter-spacing="8" fill="#94a3b8">DISPONIBLE PARA PROYECTOS REMOTOS · GMT-3</text>
  <text x="600" y="580" text-anchor="middle" font-family="Cinzel, serif" font-size="22" letter-spacing="16" fill="#fbbf24" opacity="0.7">eliasuribe.dev</text>
</svg>
